[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentstress"
version = "0.1.0"
description = "A stress-test benchmark that provokes MAST failure modes in LLM agent frameworks, and shows how much of the failure comes from the framework's own prompt scaffolding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arth Patel", email = "arth405@gmail.com" }]
keywords = ["llm", "agents", "benchmark", "evaluation", "langgraph", "crewai", "reliability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Base install: scenarios, mock world, tracing, deterministic grader, CLI.
# Frameworks and the LLM judge are optional so a user installs only what they run.
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2", "langchain-core>=1.6", "langchain-ollama>=1.1", "langchain-openai>=1.6"]
crewai = ["crewai>=1.15"]
openai = ["openai-agents>=0.22"]
judge = ["anthropic>=0.40"]
all = ["agentstress[langgraph,crewai,openai,judge]"]
dev = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/REPLACE-ME/agentstress"
Paper = "https://github.com/REPLACE-ME/agentstress/tree/main/paper"

[project.scripts]
agentstress = "agentstress.cli:main"

[tool.setuptools.packages.find]
include = ["agentstress*"]

[tool.setuptools.package-data]
agentstress = ["grading/*.md"]
